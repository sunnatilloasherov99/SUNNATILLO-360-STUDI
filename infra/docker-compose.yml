services:
  web:
    build:
      context: ../frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
    networks: [studio]
  api:
    build:
      context: ../backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8080}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-studio}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-studio}
      MEDIA_STORAGE_PATH: /data/media
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - studio_media:/data/media
    depends_on:
      db:
        condition: service_healthy
    networks: [studio]
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-studio}
      POSTGRES_USER: ${POSTGRES_USER:-studio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [studio]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-studio} -d ${POSTGRES_DB:-studio}"]
      interval: 10s
      timeout: 5s
      retries: 5
networks:
  studio:
    driver: bridge
volumes:
  postgres_data:
  studio_media:
