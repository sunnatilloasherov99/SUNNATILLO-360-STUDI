name: Build verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm install
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Verify database migrations
        run: alembic upgrade head
        env:
          ENVIRONMENT: production
          JWT_SECRET: ci-test-secret-not-for-deployment-0123456789
          DATABASE_URL: sqlite:///./migration-check.db
          MEDIA_STORAGE_PATH: ./migration-media
      - name: Verify migration of an existing database
        run: |
          python - <<'PY'
          import sqlite3
          connection = sqlite3.connect("legacy-check.db")
          connection.executescript("""
          CREATE TABLE projects (
            id VARCHAR(36) PRIMARY KEY,
            owner_id VARCHAR(36),
            name VARCHAR(160) NOT NULL,
            mode VARCHAR(16) NOT NULL,
            created_at DATETIME NOT NULL,
            updated_at DATETIME NOT NULL,
            edit_settings_json TEXT NOT NULL DEFAULT '{}',
            tour_json TEXT NOT NULL DEFAULT '{}'
          );
          CREATE TABLE media_assets (
            id VARCHAR(36) PRIMARY KEY,
            project_id VARCHAR(36) NOT NULL,
            original_name VARCHAR(255) NOT NULL,
            stored_name VARCHAR(80) NOT NULL UNIQUE,
            content_type VARCHAR(100) NOT NULL,
            size_bytes INTEGER NOT NULL,
            created_at DATETIME NOT NULL
          );
          """)
          connection.close()
          PY
          alembic upgrade head
        env:
          ENVIRONMENT: production
          JWT_SECRET: ci-test-secret-not-for-deployment-0123456789
          DATABASE_URL: sqlite:///./legacy-check.db
          MEDIA_STORAGE_PATH: ./legacy-media
      - run: python -m compileall -q app
      - run: pytest -q

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check backup script syntax
        run: bash -n infra/backup.sh infra/restore.sh
      - name: Validate Docker Compose configuration
        run: |
          cp infra/.env.example infra/.env
          docker compose --env-file infra/.env -f infra/docker-compose.yml config --quiet
      - name: Build deployable Docker images
        run: docker compose --env-file infra/.env -f infra/docker-compose.yml build api web
      - name: Validate Nginx configuration
        run: docker run --rm --add-host api:127.0.0.1 infra-web:latest nginx -t
