server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Match the API's configured 100 MB default upload limit with a small multipart margin.
  client_max_body_size 105m;
  client_body_timeout 120s;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location /api/ {
    # Resolve the Compose service at request time so nginx -t also works during image checks.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $api_upstream api:8000;
    proxy_pass http://$api_upstream/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Stream large media uploads instead of buffering the full request in Nginx.
    proxy_request_buffering off;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}